var SY=[['spind','Fint spind'],['klistret','Klistrede blade'],['dun','Hvidt dun'],['skjold','Brune skjolde'],['fluer','Små flyvende insekter'],['prikker','Lyse prikker eller sølvstriber'],['huller','Huller i bladene'],['slim','Slimspor'],['myrer','Myrer'],['meldug','Hvidt, melagtigt lag'],['pletter','Pletter på bladene'],['skimmel','Grå eller hvid skimmel'],['visne','Visne eller gule blade'],['gange','Slyngede gange i bladene']];
var SKD=[
['Spindemider','sh',['spind','prikker'],'Fine spind mellem blade og stilke, lyse prikker på bladene og blade, der bliver mat og tørre. Angriber især i varm, tør luft, fx ved radiatorer og i drivhuset.',['Isolér planten fra de andre.','Brus bladene af med lunkent vand, især undersiden. Gentag hver 2.–3. dag.','Hæv luftfugtigheden, og flyt planten væk fra radiatoren.','Sprøjt med sæbevand (ca. 1 tsk ren grøn sæbe pr. liter vand), og gentag hver 3. dag i 2–3 uger. Prøv først på ét blad.','Rovmider (Phytoseiulus persimilis) kan købes og sættes på planten, især i drivhus.','Er angrebet kraftigt, kan du klippe de værste skud af eller kassere planten.'],'Hold luften fugtig, tjek bladenes underside jævnligt, og sæt nye planter i karantæne i 2 uger.','Sæbevand kan irritere øjne og hud. Hold dyr og børn væk, til bladene er tørre.'],
['Trips','sh',['prikker','fluer'],'Sølvfarvede striber og små sorte prikker på bladene, krøllede nye blade og misfarvede blomster. Selve insekterne er meget små og smalle og hopper væk.',['Isolér planten.','Hæng blå limfælder op, så du kan se og fange de voksne.','Brus planten af, og fjern de værst angrebne blade og blomster.','Sprøjt med sæbevand eller neemolie (følg etiketten), og gentag hver 5. dag i 3 uger.','Rovmider (Amblyseius) kan sættes ud, især i drivhus.'],'Sæt nye planter i karantæne, og tjek blomster og nye skud jævnligt.','Neemolie og sæbe kan skade bladene i skarp sol. Sprøjt om aftenen, og prøv først på ét blad.'],
['Bladlus','sh',['klistret','myrer'],'Små grønne, sorte eller lysebrune lus på nye skud, knopper og bladundersider. Bladene bliver krøllede og klistrede, og der kan komme sort skimmel. Myrer i nærheden er et tegn.',['Skyl lusene af med en kraftig vandstråle, eller tør dem af med en fugtig klud.','Sprøjt med sæbevand hver 3. dag, til de er væk.','Klip stærkt angrebne skudspidser af.','Mariehøns, blomsterfluer og snyltehvepse spiser lusene. Du kan købe dem til drivhus og stue.','Bekæmp myrerne, for de beskytter lusene.'],'Undgå for meget kvælstofgødning, der giver bløde skud, som lusene elsker.','Fjern klistret belægning og skimmel med en fugtig klud.'],
['Uldlus','sh',['dun','klistret'],'Hvide, bomuldsagtige totter i bladhjørner, på stilke og på undersiden af blade. Planten vokser dårligt og kan blive klistret.',['Isolér planten.','Dup hver lus med en vatpind dyppet i rensesprit (ca. 70 %). Prøv først på ét blad.','Tør efter med sæbevand, og gentag hver uge i 4 uger.','Tjek også jorden og rodnettet, for lusene kan sidde i potten.','Snyltehvepse og mariehønen Cryptolaemus kan bruges i drivhus og stue.','Kasser planten, hvis angrebet er helt ude af kontrol.'],'Sæt nye planter i karantæne. Uldlus kommer ofte med nykøbte planter.','Sprit er brandfarlig og kan skade planter med voksbelægte blade, fx nogle sukkulenter. Prøv først på ét blad.'],
['Skjoldlus','sh',['skjold','klistret'],'Små brune eller gule, hårde skjolde på stilke og bladundersider. De sidder fast og bevæger sig næsten ikke. Planten kan blive klistret.',['Skrab skjoldene af med en negl, en blød tandbørste eller en vatpind.','Tør planten af med sæbevand, og gentag hver uge i 4–6 uger.','Klip hårdt angrebne skud af.','Olie-sprøjtemidler kan hjælpe, men skjoldene beskytter lusene, så mekanisk fjernelse virker bedst.','Snyltehvepse kan bruges i drivhus.'],'Tjek stilke og bladundersider jævnligt, især på planter med læderagtige blade.',''],
['Hvide fluer','sh',['fluer','klistret'],'Små hvide fluer, der flyver op, når du rører planten. På bladundersiden sidder små, flade larver. Bladene bliver gule og klistrede.',['Hæng gule limfælder op ved planten.','Støvsug fluerne forsigtigt op fra bladene tidligt om morgenen, når de er sløve.','Sprøjt undersiden af bladene med sæbevand hver 3. dag i 3 uger.','Fjern stærkt angrebne blade.','Snyltehvepsen Encarsia formosa bruges ofte i drivhus.'],'Luft ud i drivhuset, og tjek nye planter. Fluerne trives i varm og stillestående luft.','Limfælder er klistrede. Hold dem væk fra børn og dyr.'],
['Sørgemyg i jorden','sh',['fluer'],'Små, mørke myg, der flyver op fra potten, når du vander. Larverne lever i fugtig jord og kan skade fine rødder, især hos kimplanter.',['Lad jorden tørre i de øverste par centimeter mellem hver vanding.','Hæng gule limfælder op, eller læg dem fladt på jorden.','Dæk jorden med et lag sand eller fint grus.','Produkter med Bti (Bacillus thuringiensis israelensis) kan blandes i vandet og dræber larverne.','Nematoder (Steinernema feltiae) kan købes og vandes ud i jorden.','Omplant i frisk jord ved kraftigt angreb.'],'Vand mindre, sørg for dræn, og lad ikke vandet stå i underskålen.','Bti regnes for ufarligt for mennesker og husdyr, men læs altid etiketten.'],
['Myrer','sh',['myrer'],'Myrer, der går op og ned ad planten eller kommer fra potten. De er ofte et tegn på bladlus, uldlus eller skjoldlus, som de passer for den søde, klistrede væske.',['Find og bekæmp lusene først. Så mister myrerne interessen.','Tør klistret belægning af bladene.','Sæt potten i en skål med vand, så myrerne ikke kan komme op.','Udendørs kan et klæbebånd om stammen holde dem tilbage på træer og buske.','Find boet, hvis de bor i potten, og omplant i frisk jord.'],'Hold planterne fri for lus og klistrede rester.',''],
['Snegle','h',['huller','slim'],'Uregelmæssige huller i bladene, slimspor og afgnavede kimplanter. Angrebene sker mest om natten og efter regn.',['Gå en runde om aftenen eller tidligt om morgenen, og saml sneglene.','Læg brædder eller tomme urtepotter ud som skjul, og tøm dem hver morgen.','Sneglehegn af kobber eller et bælte af grus kan holde dem væk fra potter og bede.','Sneglekorn med jernfosfat kan strøs tyndt. Følg etiketten.','Nematoder (Phasmarhabditis) kan vandes ud i haven mod sneglene.','Opmuntr naturlige fjender som pindsvin, tudser, fugle og løbebiller.'],'Vand om morgenen i stedet for om aftenen, og hold området frit for skjul.','Undgå sneglekorn med metaldehyd, som er giftigt for hunde og katte. Tjek altid etiketten.'],
['Kålorm','h',['huller'],'Grønne larver og huller i kålblade samt sorte ekskrementer. Gule æg sidder på bladundersiden. Larverne kommer fra kålsommerfuglen og kålmøl.',['Saml larver og æg af i hånden, helst hver dag.','Dæk kålplanterne med insektnet, så snart de er plantet ud.','Fjern angrebne blade, og sæt dem i en lukket pose i skraldespanden.','Biologiske midler med Bt (Bacillus thuringiensis) findes. Tjek, at de er godkendt til private, og følg etiketten.','Opmuntr fugle og snyltehvepse i haven.'],'Insektnet fra første dag er det mest effektive.',''],
['Jordlopper','h',['huller'],'Små, runde huller i bladene på kål, radiser og rucola. Små, sorte biller hopper væk, når du rører planten. Angrebet er værst i tørre, varme perioder.',['Hold jorden jævnt fugtig, for billerne elsker tørke.','Dæk med insektnet lige efter såning eller udplantning.','Vand regelmæssigt, og sæt planterne tæt, så de skygger for jorden.','Gule limfælder kan fange billerne.','Hold øje med unge planter, for de tåler angreb dårligt.'],'Insektnet og jævn vanding. Plant ikke kål og radiser samme sted flere år i træk.',''],
['Mus og rotter','h',['huller'],'Gnavede løg, knolde, frø og planteskud, tunneler i bedet og afgnavede kimplanter. Mus og rotter ses især om natten og om vinteren.',['Opbevar frø, løg og knolde i tætte metal- eller plastbeholdere.','Læg løg i trådkurve eller under net, når du planter dem ud.','Fjern fødekilder som fuglefoder på jorden og åbne kompostbunker med madrester.','Fælder kan bruges. Vælg lovlige og dyrevenlige modeller, og hold dem uden for børns og kæledyrs rækkevidde.','Mistænker du rotter, skal du kontakte kommunen.'],'Hold drivhus og skur ryddeligt, og luk huller, hvor dyrene kan komme ind.','Giftlokkemad er farligt for børn og kæledyr og kan også ramme rovfugle og ugler. Brug det kun efter nøje råd.'],
['Rådyr, harer og kaniner','h',['huller'],'Afbidte skud og blade. Kaniner og harer bider skråt af i lav højde. Rådyr river og nipper ofte i højere skud og knopper.',['Sæt et tæt hegn om. Mod rådyr skal det være mindst 1,5 m højt, mod kaniner skal det være tæt og graves ned i jorden.','Beskyt unge træer med stammebeskyttelse eller net.','Duftmidler og afskrækning kan hjælpe en tid, men virker sjældent længe.','Vælg planter, de ikke bryder sig om, fx lavendel, rosmarin og salvie.','Beskyt frugtbuske og unge træer især om vinteren, hvor dyrene har mindst at æde.'],'Hegn og stammebeskyttelse er de mest pålidelige.',''],
['Meldug','sh',['meldug'],'Hvidt, melagtigt lag på blade, stilke og knopper. Bladene krøller, bliver gule og falder af. Rammer især i tør luft med fugtige nætter og på planter, der står trængt.',['Fjern og kassér stærkt angrebne blade. Kom dem i skraldespanden og ikke på komposten.','Giv planterne mere luft og lys, og undgå at vande på bladene.','Sprøjt med mjølk og vand (1 del mælk til 9 dele vand) en gang om ugen. Det kan hjælpe mod tidlig meldug.','Du kan også prøve bagepulver (1 tsk pr. liter vand med lidt sæbe).','Vælg modstandsdygtige sorter næste gang.'],'Giv god plads, vand ved roden, og undgå for meget kvælstofgødning.','Prøv først på ét blad. Svampemidler skal være godkendt til private og bruges efter etiketten.','f'],
['Gråskimmel','sh',['skimmel','pletter'],'Grå, fnuget skimmel på blomster, frugt, blade og stilke, ofte i fugtigt og køligt vejr. De angrebne dele bliver brune og bløde.',['Fjern alle angrebne dele med det samme, og smid dem i skraldespanden.','Luft ud, og sørg for god luftcirkulation, især i drivhus.','Vand om morgenen og ved roden, så bladene kan tørre.','Fjern visne blomster og døde blade løbende.','Undgå at plante for tæt, og brug ikke for meget gødning.'],'Luft, lys og tørre blade er det bedste værn.','Skimmelsporer kan give allergi. Brug gerne handsker og maske, når du fjerner meget.','f'],
['Sodskimmel','sh',['pletter','klistret'],'Sort, sodagtig belægning på blade og stilke. Det er svampe, der vokser på den klistrede honningdug fra lus. De skader ikke planten direkte, men tager lyset.',['Find og bekæmp lusene (bladlus, skjoldlus, uldlus og hvide fluer). Det er den egentlige årsag.','Tør belægningen af med en fugtig klud og lidt mild sæbe.','Brus planten af, hvis det er muligt.','Gentag, til belægningen er væk.'],'Hold planterne fri for lus.','','f'],
['Rødråd','sh',['visne'],'Planten hænger, bladene bliver gule og falder af, selv om jorden er våd. Rødderne er brune, bløde og lugter af råd. Skyldes ofte for meget vand og dårlig dræning.',['Tag planten op af potten, og ryst jorden af rødderne.','Klip alle brune, bløde og lugtende rødder af med rene sakse. Sunde rødder er faste og lyse.','Klip også noget af toppen, så der er balance mellem rødder og blade.','Omplant i ny, luftig jord og en ren potte med dræn.','Vand først, når jorden er tør i de øverste centimeter.'],'Vand mindre, sørg for dræn, og lad ikke vandet stå i underskålen.','Er hele rodnettet rådnet, kan planten ikke reddes. Prøv at tage en stikling af en sund top.','f'],
['Bladpletsvamp','sh',['pletter'],'Brune eller sorte pletter på bladene, ofte med en gul rand. Pletterne kan flyde sammen, og bladene falder af. Spredes med vandstænk.',['Fjern angrebne blade, og smid dem i skraldespanden.','Vand ved roden, og undgå, at vandet sprutter op på bladene.','Giv planten mere luft og lys.','Rengør redskaber, så smitten ikke spredes.','Vedvarende angreb kan behandles med et svampemiddel godkendt til private. Følg etiketten.'],'Luft, god plads og tørre blade.','','f'],
['Rust','h',['pletter'],'Orange eller rustbrune pustler på bladundersiden og lysegule pletter på oversiden. Ses ofte på roser, stokroser, pelargonier, porre og purløg.',['Fjern og kassér angrebne blade.','Undgå at vande på bladene.','Giv plads og luft, og fjern visne blade.','Skær stærkt angrebne planter ned, og smid afklippet ud.','Vælg modstandsdygtige sorter.'],'Hold planterne luftige, og fjern efterårsløv.','','f'],
['Sortplet på roser','h',['pletter'],'Sorte, frynsede pletter på rosenbladene med gul kant. Bladene falder af tidligt, og planten svækkes. Ses især i fugtigt sommervejr.',['Fjern og kassér angrebne blade, både på planten og på jorden.','Vand ved roden, og undgå vand på bladene.','Klip busken let, så der kommer luft ind.','Saml løvet op om efteråret, og kasser det.','Vælg sundhedsstærke rosensorter.'],'Luft i busken og rent løv om efteråret.','','f'],
['Tomatskimmel','h',['pletter','skimmel'],'Mørkebrune, våde pletter på bladene med lysegrøn rand og hvid skimmel på undersiden i fugtigt vejr. På frugterne kommer store, hårde brune pletter. Spreder sig meget hurtigt.',['Fjern og kassér angrebne blade og frugter med det samme, i en lukket pose i skraldespanden.','Hold bladene tørre. Vand ved roden.','Giv god plads, og fjern de nederste blade, så der kommer luft.','Tomater i drivhus eller under tag klarer sig bedst.','Vælg resistente sorter.'],'Plant ikke tomater og kartofler samme sted år efter år.','Spis ikke frugter, der er angrebet.','f'],
['Skimmel på jorden','sh',['skimmel'],'Hvidt eller gråt, fnuget lag på jordoverfladen. Skyldes ofte for fugtig jord og stillestående luft, og er som regel ufarligt for planten.',['Skrab det øverste lag jord af, og erstat det med frisk jord.','Lad jorden tørre mellem hver vanding.','Flyt planten til et lysere sted med bedre luft.','Sørg for dræn, og tøm underskålen.'],'Vand mindre, og luft ud.','Skimmelsporer kan give allergi hos nogle. Kontakt lægen ved åndedrætsproblemer.','f'],
['Æbleskurv','h',['pletter'],'Mørke, skurvede pletter på æbler og blade. Æblerne kan revne og blive misformede.',['Fjern faldne blade om efteråret, så svampen ikke overvintrer.','Fjern angrebne frugter.','Klip kronen, så den er åben og lufttør.','Vælg skurvresistente sorter ved nyplantning.','Svampemidler til private kan bruges. Følg etiketten.'],'Luft i kronen og rent løv om efteråret.','','f'],
['Rodlus','sh',['visne','dun'],'Hvide, voksdækkede lus på rødderne og i jorden, især i potter. Planten hænger og vokser dårligt trods vanding. Du ser dunet, når du tager planten op af potten.',['Tag planten ud af potten, og skyl rødderne af i lunkent vand.','Fjern al gammel jord, og klip stærkt angrebne rødder af.','Omplant i frisk jord og en ren potte.','Skyl potten i varmt sæbevand.','Isolér planten i et par uger, og tjek rødderne igen.'],'Brug frisk jord til nye planter, og tjek rødderne ved omplantning.',''],
['Bladminerer','sh',['gange'],'Lyse, slyngede gange i bladene, som larver har gnavet inde i bladet. Bladene kan visne og falde af. Larven ses som en lille prik i enden af gangen.',['Fjern og kassér angrebne blade, mens larven stadig sidder i.','Klem larven mellem fingrene gennem bladet.','Hæng gule limfælder op for at fange de voksne fluer.','Dæk med insektnet udendørs.','Gentag ugentligt, til der ikke kommer nye gange.'],'Tjek nye planter, og dæk udendørs med net.',''],
['Buksbomhalvmøl','h',['huller','visne'],'Grønne larver med sort hoved, der spinder hvidt spind og æder bladene på buksbom. Busken bliver brun og bar.',['Gå buksbomhækken efter for larver og spind fra april til oktober.','Skyl larverne ud med en kraftig vandstråle, eller støvsug dem op.','Klip de angrebne dele af, og smid dem i en lukket pose.','Feromonfælder kan vise, hvornår møllene flyver.','Biologiske midler med Bt kan hjælpe. Tjek, at de er godkendt til private.'],'Tjek hækken ofte fra foråret.',''],
['Bladhvepse','h',['huller'],'Grønne larver, der sidder på bladranden og æder store stykker af bladene på roser, stikkelsbær og ribs. De kan æde en busk bar på få dage.',['Saml larverne af i hånden.','Skyl dem af med en vandstråle.','Tjek undersiden af bladene for æg.','Sæt fuglehuse op. Mejser spiser larver.','Klip stærkt angrebne grene, og smid dem ud.'],'Tjek buskene ofte fra maj.',''],
['Æblevikler','h',['huller'],'Små, lyserøde larver i æblerne. Der er gnavegange mod kernehuset og ekskrementer i hullet. Æblerne falder for tidligt.',['Saml faldne æbler op hver dag.','Fjern angrebne frugter, og kassér dem.','Sæt feromonfælder op i juni for at se møllene.','Bind bølgepap om stammen, hvor larverne gemmer sig, og tjek det om vinteren.','Biologiske midler med nematoder eller Bt kan bruges. Tjek godkendelsen.'],'Rene kroner og opsamling af frugter.',''],
['Sort snudebille','sh',['huller','visne'],'Små, sorte biller, der æder halvcirkelformede huller i bladranden om natten. Larverne æder rødderne og kan få planter til at visne, især rododendron, jordbær og potteplanter.',['Tjek planterne om aftenen med lommelygte, og saml biller af.','Læg brædder ud som skjul, og tjek dem om morgenen.','Brug nematoder (Heterorhabditis) i fugtig jord, når den er over ca. 12 grader, mod larverne.','Hold området rent for skjul.','Hold øje med visne planter, og tjek rødderne for hvide, bøjede larver.'],'Nematoder tidligt på sæsonen og rene bede.',''],
['Muldvarpe og studsmus','h',['huller'],'Jordhøje på plæne og i bede og gange under jorden. Muldvarpen æder orme og larver, ikke planter, men gangene kan løfte rødderne. Studsmus gnaver rødder, løg og træets bark.',['Find ud af, om det er muldvarp (høje) eller studsmus (små huller og gnavede rødder).','Sæt løg og unge planter i trådkurve eller under net.','Sæt en voleskærm af trådnet om unge træer.','Udjævn højene, og fjern forladte gange.','Tjek reglerne for fangst, før du bruger fælder.'],'Voleskærm og net ved nyplantning.',''],
['Fugle','h',['huller'],'Fugle, der pikker i bær, knopper og frugter, især kirsebær, ribs, jordbær og blåbær.',['Dæk med fuglenet, så snart bærrene begynder at få farve. Fastgør nettet tæt, så fuglene ikke kommer ind under.','Hæng skinnende bånd eller cd-skiver op. Det virker kun en tid.','Saml frugt, der er faldet.','Giv fuglene alternativt foder, så de ikke går efter bærrene.','Tjek nettet jævnligt for fanget dyr.'],'Net sat op i tide er det mest pålidelige.','Fuglenet kan fange fugle og pindsvin. Brug net med små masker, og stram det godt.'],
['Ørentvist','h',['huller'],'Brunlige insekter med tang bagpå, der gnaver huller i kronblade, især på georginer og andre blomster. De er aktive om natten.',['Stop en potte fyldt med halm eller hø på en pind. Ørentvisten gemmer sig i den om dagen.','Tøm potten hver morgen langt fra haven.','Fjern skjul som bunker af blade og brædder tæt på planterne.','Husk, at de også spiser lus, så et par stykker kan tåles.'],'Hold området om blomsterne rent for skjul.','']
];
function chip(t,on,a){return '<button class="'+(on?'btn':'btn2')+'" style="min-height:40px;padding:0 12px" '+a+' aria-pressed="'+on+'">'+t+'</button>'}
function skList(){var r=SKD.map(function(p,i){return[p,i]}).filter(function(x){var p=x[0];return(!SK.f||p[1].indexOf(SK.f)>-1)&&(!SK.t||(p[7]||'d')==SK.t)&&(!SK.sym||p[2].indexOf(SK.sym)>-1)&&(!SK.q||(p[0]+' '+p[3]).toLowerCase().indexOf(SK.q.toLowerCase())>-1)});return r.length?r.map(function(x){return '<button class="pick" data-sk="'+x[1]+'"><span><b>'+x[0][0]+'</b><br><span class="mut">'+x[0][3].split('. ')[0]+'.</span></span></button>'}).join(''):'<p class="mut">Ingen skadedyr passer. Prøv at fjerne et filter.</p>'}
function vSkade(){if(SK.open>=0){var p=SKD[SK.open];return '<button class="lnk" style="padding:0;min-height:44px" data-skb>‹ Tilbage</button><h1>'+p[0]+'</h1><div class="mut">'+(p[7]=='f'?'Svamp og sygdom · ':'Dyr · ')+(p[1]=='sh'?'Stue, have og drivhus':'Have og drivhus')+'</div>'+pimg(p[0])+'<div class="card"><h2>Sådan ser du det</h2><div>'+p[3]+'</div></div><div class="card"><h2>Gør sådan</h2><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">'+p[4].map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol></div><div class="card"><h2>Forebyg</h2><div>'+p[5]+'</div></div>'+(p[6]?'<div class="warn">'+p[6]+'</div>':'')+'<div class="mut">Vejledningen er generel. Prøv nye midler på ét blad først, og følg altid etiketten på sprøjtemidler.</div>'}
return '<h1>Skadedyr</h1><div class="mut">Find ud af, hvad der æder eller suger på dine planter, og hvad du kan gøre.</div><details style="margin:10px 0"><summary>Sådan griber du det an</summary><p><b>1.</b> Isolér planten. <b>2.</b> Find ud af, hvad der er galt. <b>3.</b> Start med det mekaniske: fjern, brus af, skrab af. <b>4.</b> Brug sæbevand eller olie, hvis det ikke er nok. <b>5.</b> Brug nyttedyr, hvis angrebet er stort. <b>6.</b> Kemiske midler er sidste udvej, og kun hvis de er godkendt til private.</p><p class="mut">Prøv altid et nyt middel på ét blad først, og vent et par dage. Hold børn og kæledyr væk, til planten er tør.</p></details><input type="search" id="skq" placeholder="Søg fx bladlus eller snegle" aria-label="Søg skadedyr" value="'+esc(SK.q)+'"><div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">'+chip('Alle',!SK.f,'data-skf=""')+chip('Stue',SK.f=='s','data-skf="s"')+chip('Have og drivhus',SK.f=='h','data-skf="h"')+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px">'+chip('Alle typer',!SK.t,'data-skt=""')+chip('Dyr',SK.t=='d','data-skt="d"')+chip('Svampe og sygdomme',SK.t=='f','data-skt="f"')+'</div><div class="mut" style="margin:4px 0">Hvad ser du?</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px">'+SY.map(function(s){return chip(s[1],SK.sym==s[0],'data-sym="'+s[0]+'"')}).join('')+'</div><div id="sklist">'+skList()+'</div>'}
var calM=null,calD=null;
function dueN(){return S.plants.filter(function(p){return rel(p)<=0}).length}
function plantMap(y,m){var map={},end=new Date(y,m+1,0),t0=day0();S.plants.forEach(function(p){var n=days(p.pid,p.vi,p.ai,p.lamp),t=day0(effLast(p));t.setDate(t.getDate()+n);if(t<t0)t=new Date(t0);while(t<=end){var k=iso(t);(map[k]=map[k]||[]).push(p);t=new Date(t);t.setDate(t.getDate()+n)}});return map}
function vKalender(){var now=new Date();if(!calM)calM={y:now.getFullYear(),m:now.getMonth()};if(!calD)calD=iso(now);var y=calM.y,m=calM.m,map=plantMap(y,m),first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),today=iso(now);
var h='<h1>Kalender</h1><div class="row"><button class="btn2" style="min-height:44px;min-width:48px" data-cal="-1" aria-label="Forrige måned">‹</button><h2>'+M[m]+' '+y+'</h2><button class="btn2" style="min-height:44px;min-width:48px" data-cal="1" aria-label="Næste måned">›</button></div><div class="cal">';
['Man','Tir','Ons','Tor','Fre','Lør','Søn'].forEach(function(w){h+='<div class="cw">'+w+'</div>'});
for(var i=0;i<first;i++)h+='<div></div>';
for(var d=1;d<=dim;d++){var k=y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+d).slice(-2),c=(map[k]||[]).length;h+='<button class="cd'+(k==today?' td':'')+(k==calD?' sel':'')+'" data-day="'+k+'" aria-label="'+d+'. '+M[m]+(c?', '+c+(c==1?' plante':' planter')+' skal vandes':'')+'">'+d+(c?'<span class="dt">'+c+'</span>':'')+'</button>'}
h+='</div>';var a=calD.split('-'),dt=new Date(+a[0],+a[1]-1,+a[2]),L=map[calD]||[];
h+='<div class="card"><h2>'+dt.getDate()+'. '+M[dt.getMonth()]+'</h2>';if(!L.length)h+='<div class="mut">Ingen planter skal vandes denne dag</div>';
L.forEach(function(p){h+='<div class="row"><span><b>'+P[p.pid][0]+'</b><br><span class="mut">'+loc(p)+'</span></span>'+(calD<=today?'<button class="btn" style="min-height:44px" data-wet="'+p.id+'">Vandet</button>':'')+'</div>'});h+='</div>';
var ns,nb='';if(!('Notification' in window))ns='Din browser understøtter ikke notifikationer her.';else if(Notification.permission=='granted')ns='Slået til. Du får en besked, når du åbner appen, og planter skal have vand.';else if(Notification.permission=='denied')ns='Blokeret i browseren. Tillad notifikationer for siden i browserens indstillinger.';else{ns='Få en besked, når du åbner appen, og planter skal have vand.';nb='<button class="btn" style="min-height:48px" data-notif>Slå notifikationer til</button>'}
h+='<div class="card"><h2>Påmindelser</h2><div class="mut">'+ns+'</div>'+nb+'<div class="mut">Beskeder vises kun, mens appen er åben. Datoerne i kalenderen er forventede ud fra årstiden nu.</div></div>';return h}
function askNotif(){try{Notification.requestPermission().then(function(){render();notify()})}catch(e){render()}}
function notify(){try{if(!('Notification' in window)||Notification.permission!='granted')return;var n=dueN();if(!n)return;var k='sn'+iso(new Date());if(localStorage.getItem(k))return;localStorage.setItem(k,'1');new Notification('Grønthus',{body:n+(n==1?' plante skal':' planter skal')+' have vand i dag'})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden){render();notify()}});
render();notify();wxFetch();sbInit();
</script>
